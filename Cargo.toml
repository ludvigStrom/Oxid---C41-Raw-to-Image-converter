[package]
name = "c41_raw_tool"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
# Pure-Rust RAW decoding (replaces LibRaw)
rawloader = "0.37"

# N-dimensional arrays, used for the image volume
ndarray = { version = "0.17.2", features = ["rayon"] }

# Parallelism for batch processing (used later in the pipeline)
rayon = "1.10.0"

# CLI argument parsing
clap = { version = "4.5.4", features = ["derive"] }

# For future 16-bit TIFF export
tiff = "0.11.0"

# Simple error handling for the CLI and I/O
anyhow = "1.0"

# PNG (and other raster) ingestion for development
image = "0.25"

# OpenEXR (EXR) output
exr = "1.74"

# Linear algebra for calibration (3×3 OLS solver)
nalgebra = "0.34"

# JSON serialization for calibration profiles
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# .c41 profile format (zip with profile + LUT)
zip = "2.2"

# GUI (optional binary)
eframe = { version = "0.29", optional = true }
rfd = { version = "0.15", optional = true }
arboard = { version = "3", optional = true }

# GPU pipeline (optional)
wgpu = { version = "24", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

[features]
default = []
gui = ["eframe", "rfd", "arboard"]
gpu = ["wgpu", "pollster", "bytemuck"]

[[bin]]
name = "c41-gui"
path = "src/bin/c41_gui.rs"
required-features = ["gui"]

